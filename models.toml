# Default System One model lanes. Pass this file with --models-file after
# changing a base URL or pinning local artifact and runtime revisions.

[models.jev]
base_url = "https://api.typesafe.ai"
model = "jev-1.13.0"
api_key_env = "TYPESAFE_API_KEY"

[models.openjev]
base_url = "https://api.codiv.ai"
model = "openjev-0.1"
api_key_env = "CODIV_API_KEY"
artifact = "nvidia/diffusiongemma-26B-A4B-it-NVFP4"
artifact_revision = "ec4ff3df205028f4e81c954c2227f9312b3ec2ea"
# The hosted runtime is managed by Codiv. Pin these fields only for self-hosted runs.
# runtime = "openjev"
# runtime_revision = "e04794ab36e4f7e6040c2547baecdb2737ce2e79"
# container_digest = "sha256:<digest>"
# quantization = "NVFP4"
# hardware = "<GPU model>"
# training_exposure = "unknown"

[models.kev]
base_url = "http://127.0.0.1:8009"
model = "kev-latest"
api_key = "local"
artifact = "jaredpalmer/kev-4b"
artifact_revision = "485ace8703592fcf405488b262449990824cfed1"
runtime = "kev"
runtime_revision = "5e94a28818cfd3d0ec9b8bca046dc8db0d79a704"
quantization = "bf16"
hardware = "Apple M3 Pro, 36 GiB unified memory"
training_exposure = "No Minesweeper, Tetris, or Pong exposure declared in the Kev-4B model card"

[models.laya]
base_url = ""
model = "laya-0.3.5"
artifact = "convaiinnovations/laya"
artifact_revision = "1c5edc17a7acd8701df6fc341c0d179f1c62c982"
runtime = "laya"
runtime_revision = "0.3.5"
quantization = "fp32"
training_exposure = "No Minesweeper, Tetris, or Pong exposure declared"

[models.laya-typed]
base_url = ""
model = "laya-typed-decisions-0.3.5"
artifact = "convaiinnovations/laya-typed-decisions"
artifact_revision = "f9ab0b228f0fc0f14d873dbc99038f135c2da1b2"
runtime = "laya"
